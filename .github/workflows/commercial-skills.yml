name: MenuIA Commercial Skills CI
on:
  push:
    branches:
      - feature/menuia-commercial-skills-v2-validate
      - feature/menuia-orchestrator-skills-runtime
      - fix/menuia-sales-compare-v2-1
      - feature/menuia-gemini-natural-v2-2
  pull_request:
    branches:
      - feature/menuia-commercial-skills-v1
      - feature/menuia-commercial-skills-v2-validate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate commercial skills and orchestrator
        run: node --test server/commercial-skills.test.mjs server/commercial-skills-v2.test.mjs server/sales-orchestrator.test.mjs
      - name: Full regression
        run: node --test server/*.test.mjs training-lab/*.test.cjs
